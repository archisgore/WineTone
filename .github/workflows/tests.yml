name: tests
on:
  push:
    branches: [main, stage]
  pull_request:
    # Code changes land on `stage` first (docs/runbooks/two-stage-deploy.md),
    # so PRs into stage must be gated too, not just PRs into main.
    branches: [main, stage]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 matches the HF Space image (python:3.12-slim); 3.14 is the
        # newest CPython and what local dev venvs use.
        python-version: ["3.12", "3.14"]

    # pgvector-enabled Postgres so the migrations and the FastAPI smoke
    # tests (tests/test_app_smoke.py) actually run instead of skipping.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: winetone
          POSTGRES_PASSWORD: winetone
          POSTGRES_DB: winetone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winetone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WINETONE_DB_URL: postgresql://winetone:winetone@localhost:5432/winetone
      # CPU-only torch wheels: the default PyPI wheel drags in ~3 GB of
      # CUDA libraries that CI never uses.
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests (everything except the live-site e2e suite)
        run: pytest tests --ignore=tests/e2e -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check src tests
