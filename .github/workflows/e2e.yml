name: e2e

# End-to-end smoke tests against a live deploy. Two main triggers:
#
#   - workflow_dispatch — manual run from the Actions tab. Pick which
#     environment via the `target` input. Useful for ad-hoc verification.
#   - schedule          — nightly run against prod. Catches anything
#                          that drifts between deploys (HF Inference
#                          rate-limits changing, Neon connection-string
#                          rotations, third-party CDN outages).
#   - push to `stage`   — auto-runs against staging.tone.wine after every
#                          push, acting as a quality gate before promoting
#                          stage→main.
#
# Anonymous coverage runs everywhere. Authenticated tests run only
# when the workflow runs against staging AND both `CLERK_SECRET_KEY`
# and `CLERK_E2E_USER_ID` are present in the production environment
# (the fixtures call Clerk's Backend API at test time to mint a fresh
# sign-in ticket — no captured cookies). Fixtures self-skip otherwise.
# See docs/runbooks/e2e-testing.md.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to test against'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod
  schedule:
    # 06:00 UTC every day (≈ 23:00 PT). Always against prod.
    - cron: '0 6 * * *'
  push:
    branches: [stage]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Authenticated tests need CLERK_SECRET_KEY + CLERK_E2E_USER_ID.
    # These are repo-level (not environment-scoped) so that every
    # trigger — including stage-branch pushes that pre-gate the
    # stage→main promotion — can resolve them. They're dev-Clerk-
    # instance only (sk_test_…), with no path to production data,
    # so the broader repo scope is acceptable here. The genuinely
    # sensitive secrets (WINETONE_DB_URL, HF_TOKEN_WRITE,
    # BACKUP_REPO_TOKEN) stay environment-scoped on `production`.
    timeout-minutes: 10

    steps:
      - name: Resolve checkout ref for the chosen target
        id: ref
        run: |
          # The deployed code on each env matches a specific branch:
          # staging.tone.wine ← stage branch; tone.wine ← main. We want
          # the e2e suite (which IS in the repo) to match what's deployed.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=stage" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ inputs.target }}" = "prod" ]; then
              echo "ref=main" >> "$GITHUB_OUTPUT"
            else
              echo "ref=stage" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set base URL
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "url=https://tone.wine" >> "$GITHUB_OUTPUT"
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "url=https://staging.tone.wine" >> "$GITHUB_OUTPUT"
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ inputs.target }}" = "prod" ]; then
              echo "url=https://tone.wine" >> "$GITHUB_OUTPUT"
              echo "env_name=prod" >> "$GITHUB_OUTPUT"
            else
              echo "url=https://staging.tone.wine" >> "$GITHUB_OUTPUT"
              echo "env_name=staging" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "Selected target: ${{ steps.target.outputs.env_name }} (ref: ${{ steps.ref.outputs.ref }})"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install e2e dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-playwright httpx
          playwright install --with-deps chromium

      - name: Run e2e suite against ${{ steps.target.outputs.env_name }}
        env:
          WINETONE_E2E_URL: ${{ steps.target.outputs.url }}
          # Clerk Backend API credentials for the authenticated-tests
          # fixture (tests/e2e/conftest.py::signed_in_context). Mints
          # a fresh sign-in ticket per test, redeems in a clean
          # Playwright context — no captured cookies. The dev Clerk
          # secret only mints tokens for the dev instance, so the
          # fixture auto-skips when target=prod. Forks without
          # access to repo secrets get the same skip-and-stay-green
          # behavior.
          CLERK_SECRET_KEY:  ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_E2E_USER_ID: ${{ secrets.CLERK_E2E_USER_ID }}
        run: |
          pytest tests/e2e -v --tb=short

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace-${{ steps.target.outputs.env_name }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
