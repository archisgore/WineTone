[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "winetone"
version = "0.1.0"
description = "Data + ML pipeline for the WineTone project (Pantone for wine)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Archis Gore", email = "me@archisgore.com" }]
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.28",
    "pandas>=3.0",
    "pyarrow>=26",
    "click>=8.5",
    "tenacity>=9.2",
    "rich>=15.0",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "numpy>=2.5",
    "scipy>=1.18",
    "scikit-learn>=1.9",
    "fastembed>=0.9",
    "sentence-transformers>=6.2",
    "torch>=2.15",
    "fastapi>=0.162",
    # Floor starlette explicitly (transitive dep of fastapi) so the
    # PYSEC-2026-161 fix (1.0.1) and later security fixes can't regress.
    "starlette>=1.10",
    "uvicorn>=0.54",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "sentry-sdk[fastapi]>=2.74",
    "markdown>=3.11",
    # bleach sanitizes the LLM-generated narration HTML on /ask before
    # it lands in the DOM via Jinja's `|safe`. Python-markdown does
    # NOT escape raw inline HTML — without bleach an LLM-emitted
    # `<script>` would render. Security review LOW-7 fix.
    "bleach>=6.4",
    "pyjwt[crypto]>=2.15",
    "svix>=2.10",
    "slowapi>=0.1.10",
    "anthropic>=2.8",
    "pillow>=13.0",
]

[project.optional-dependencies]
e2e = [
    "pytest>=9.2",
    "pytest-playwright>=0.10",
    "httpx>=0.28",
]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
    "mypy>=2.4",
    "pandas-stubs>=3.1",
    # Schema migrations (migrations/, alembic.ini). CI runs
    # `alembic upgrade head` against a pgvector service container.
    "alembic>=1.20",
]
# Encoder fine-tuning — only needed to RUN scripts/fine_tune_encoder.py.
# Pulls in transformers + a heavier torch path; not installed in the
# deployed Space (which uses fastembed + ONNX for serving).
finetune = [
    "sentence-transformers>=6.2",
    "accelerate>=0.30",
]
# Apple-Silicon-native acceleration. Installed only when explicitly
# requested (`pip install -e ".[mac]"`) or auto-installed by the
# Makefile's `make dev-mac` target. Falls back to PyTorch on
# non-Apple-Silicon hosts.
mac = [
    "mlx>=0.32; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.scripts]
winetone = "winetone.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/winetone"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pyflakes + pycodestyle
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
]
ignore = [
    "E501",         # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
